[project]
site_name = "NV9P Amateur Radio"
site_description = "Ham Radio projects and experiences by NV9P"
site_url = "https://www.nv9p.com/"
extra_css = ["stylesheets/nv9p.css"]
nav = [
  { "Home" = "index.md" },
  { "Blog" = ["blog/index.md"] },
  { "Logbook" = "logbook.md" },
  { "QSL Cards" = "qsl-cards.md" },
  { "About" = "about.md" },
]

[project.theme]
favicon = "img/satellite.svg"
custom_dir = "overrides"
features = [
  "navigation.indexes",
  "navigation.tabs",
  "navigation.tabs.sticky",
]

[project.theme.icon]
logo = "fontawesome/solid/satellite"

[project.theme.palette]
scheme = "slate"
primary = "deep-orange"
accent = "deep-orange"

[project.extra]
wordmark = "NV9P"
recent_posts_count = 3

[project.extra.station]
tagline = "Working satellites from the Colorado Rockies"
tags = ["DM79", "ITU 7", "CQ 4", "Rocky Mountain Div."]

[project.extra.analytics]
provider = "google"
property = "G-J9JWWV4FF8"

[[project.extra.social]]
icon = "fontawesome/brands/github"
name = "NV9P on Github"
link = "https://github.com/caseyjdavis"

# Search is enabled by default in Zensical.

[project.plugins.glightbox]
width = "100%"
height = "auto"
skip_classes = ["custom-skip-class-name"]
auto_caption = false
caption_position = "bottom"

[project.plugins.macros]
module_name = "main"

[project.plugins.blog]
blog_toc = true
archive_date_format = "yyyy"
pagination_per_page = 12

[project.markdown_extensions]
tables = {}
attr_list = {}
admonition = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.critic = {}
pymdownx.keys = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
